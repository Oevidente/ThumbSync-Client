<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ThumbSync</title>
  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#070709" />
  <!-- Compatibilidade iOS Safari / Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ThumbSync" />

  <!-- Dynamic Viewport Height Helper for Mobile Browsers with Bottom Address Bars -->
  <script>
    function setAppViewportHeight() {
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', `${vh}px`);
    }
    setAppViewportHeight();
    window.addEventListener('resize', setAppViewportHeight);
    window.addEventListener('orientationchange', setAppViewportHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppViewportHeight);
    }
  </script>

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="fonts.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['SF Pro Text', 'SF Pro', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            display: ['SF Pro Display', 'SF Pro', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            rounded: ['SF Pro Rounded', 'SF Pro', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
          fontSize: {
            // Exact Apple HIG Dynamic Type mappings for iOS
            'caption-2': ['11px', { lineHeight: '13px', letterSpacing: '0.07px' }], // Caption 2
            'caption-1': ['12px', { lineHeight: '16px', letterSpacing: '0.00px' }], // Caption 1
            'footnote': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px' }], // Footnote
            'subhead': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px' }], // Subhead
            'callout': ['16px', { lineHeight: '21px', letterSpacing: '-0.32px' }], // Callout
            'body': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px' }], // Body
            'headline': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px' }], // Headline (needs semibold)
            'title-3': ['20px', { lineHeight: '25px', letterSpacing: '0.38px' }], // Title 3
            'title-2': ['22px', { lineHeight: '28px', letterSpacing: '0.35px' }], // Title 2
            'title-1': ['28px', { lineHeight: '34px', letterSpacing: '0.36px' }], // Title 1
            'large-title': ['34px', { lineHeight: '41px', letterSpacing: '0.37px' }], // Large Title

            // Default Tailwind overrides for convenience, mapping to HIG
            'xs': ['12px', { lineHeight: '16px', letterSpacing: '0.00px' }],
            'sm': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px' }],
            'base': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px' }],
            'lg': ['20px', { lineHeight: '25px', letterSpacing: '0.38px' }],
            'xl': ['22px', { lineHeight: '28px', letterSpacing: '0.35px' }],
            '2xl': ['28px', { lineHeight: '34px', letterSpacing: '0.36px' }],
            '3xl': ['34px', { lineHeight: '41px', letterSpacing: '0.37px' }],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    html {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    /* Base Typography and Smooth Transitions */
    body {
      font-family: 'Alan Sans', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 22px;
      letter-spacing: -0.41px;
      font-weight: 400;
      background: radial-gradient(circle at 50% 50%, #151622 0%, #0b0c10 60%, #050508 100%) !important;
      /* Premium deep dark gradient background with elegant depth */
      color: #f2f2f7;
      /* iOS label color */
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      overflow: hidden;
    }

    #root,
    #app-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      overflow: hidden;
    }

    /* Animated Volumetric Background Ambient Glows (Fluent + iOS Liquid Glass) */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.65;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
      animation: floatGlow 25s infinite alternate ease-in-out;
    }

    .bg-glow-blue {
      top: -10%;
      left: -10%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.45) 0%, rgba(37, 99, 235, 0.15) 50%, transparent 80%) !important;
      animation-duration: 28s;
    }

    .bg-glow-purple {
      bottom: -15%;
      right: -10%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(124, 58, 237, 0.15) 50%, transparent 80%) !important;
      animation-duration: 32s;
      animation-delay: -5s;
    }

    .bg-glow-magenta {
      top: 25%;
      right: -15%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.42) 0%, rgba(139, 92, 246, 0.15) 50%, transparent 80%) !important;
      animation-duration: 24s;
      animation-delay: -12s;
    }

    @keyframes floatGlow {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(5%, 7%) scale(1.12);
      }

      100% {
        transform: translate(-3%, -3%) scale(0.92);
      }
    }

    /* Force SF Pro Display for text sizes 20pt and above per HIG */
    .text-title-3,
    .text-title-2,
    .text-title-1,
    .text-large-title,
    .text-lg,
    .text-xl,
    .text-2xl,
    .text-3xl,
    .text-4xl,
    .text-5xl {
      font-family: 'Alan Sans', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    }

    /* Apple HIG specific heading weights */
    .text-large-title,
    .text-3xl {
      font-weight: 400;
    }

    .text-title-1,
    .text-2xl {
      font-weight: 400;
    }

    .text-title-2,
    .text-xl {
      font-weight: 400;
    }

    .text-title-3,
    .text-lg {
      font-weight: 400;
    }

    .text-headline {
      font-weight: 600 !important;
    }

    /* Enforce Apple HIG constraints on arbitrary utility classes used in markup */
    .font-black,
    .font-extrabold {
      font-weight: 600 !important;
      /* Cap max weight to Semibold/Bold */
    }

    .text-\[9px\],
    .text-\[10px\],
    .text-\[11px\],
    .text-\[11\.5px\] {
      font-size: 11px !important;
      line-height: 13px !important;
      letter-spacing: 0.07px !important;
    }

    /* Fallback native headings styles if tags are used directly */
    h1 {
      font-family: 'Alan Sans', sans-serif;
      font-size: 34px;
      line-height: 41px;
      letter-spacing: 0.37px;
      font-weight: 700;
    }

    h2 {
      font-family: 'Alan Sans', sans-serif;
      font-size: 28px;
      line-height: 34px;
      letter-spacing: 0.36px;
      font-weight: 600;
    }

    h3 {
      font-family: 'Alan Sans', sans-serif;
      font-size: 22px;
      line-height: 28px;
      letter-spacing: 0.35px;
      font-weight: 600;
    }

    h4 {
      font-family: 'Alan Sans', sans-serif;
      font-size: 20px;
      line-height: 25px;
      letter-spacing: 0.38px;
      font-weight: 600;
    }

    /* Core App Container Overlay Overrides */
    #app-container {
      background: radial-gradient(circle at 50% 50%, rgba(13, 14, 22, 0.7) 0%, rgba(8, 9, 13, 0.82) 100%) !important;
      backdrop-filter: blur(45px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(45px) saturate(190%) !important;
      position: relative;
      z-index: 10;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.04),
        0 12px 60px rgba(0, 0, 0, 0.4) !important;
    }

    main {
      background: transparent !important;
    }

    @media (min-width: 1024px) {
      body {
        display: block !important;
        min-height: 100vh !important;
        padding: 0 !important;
        box-sizing: border-box !important;
      }

      #root {
        width: 100% !important;
        max-width: 100% !important;
        height: 100vh !important;
        min-height: 100vh !important;
        display: block !important;
      }

      #app-container {
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
        border: none !important;
        overflow: hidden !important;
        box-shadow: none !important;
      }
    }

    /* Sidebar Windows Fluent Design - Opaque Glassmorphism */
    aside.lg\:flex {
      background: rgba(13, 13, 18, 0.42) !important;
      backdrop-filter: blur(40px) saturate(210%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(210%) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.04) !important;
      box-shadow:
        inset -1px 0 0 rgba(255, 255, 255, 0.01),
        10px 0 40px rgba(0, 0, 0, 0.15) !important;
    }

    /* Dynamic Glass Header */
    header {
      background: rgba(13, 13, 18, 0.35) !important;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
    }

    /* iOS Liquid-Glass Sidebar Widgets */
    .p-3\.5.rounded-2xl.bg-white\/\[0\.015\].border.border-white\/\[0\.04\],
    .p-3\.5.rounded-2xl.bg-white\/\[0\.02\].border.border-white\/\[0\.05\] {
      background: rgba(255, 255, 255, 0.018) !important;
      border: 1px solid rgba(255, 255, 255, 0.04) !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.02),
        0 4px 12px rgba(0, 0, 0, 0.1) !important;
      border-radius: 20px !important;
    }

    /* Sophisticated Active Tab Button Overlay (Glow & Highlight) */
    aside nav button.bg-blue-600,
    #subtab-btn-mural.bg-blue-600,
    #subtab-btn-history.bg-blue-600,
    #btn-add-games-main.bg-blue-600 {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.75) 0%, rgba(139, 92, 246, 0.75) 100%) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      box-shadow:
        0 8px 24px rgba(99, 102, 241, 0.32),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        inset 0 -1px 2px rgba(0, 0, 0, 0.4) !important;
      font-weight: 700 !important;
      text-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    aside nav button.bg-blue-600:hover,
    #subtab-btn-mural.bg-blue-600:hover,
    #subtab-btn-history.bg-blue-600:hover,
    #btn-add-games-main.bg-blue-600:hover {
      transform: translateY(-1px) scale(1.02) !important;
      box-shadow:
        0 12px 28px rgba(99, 102, 241, 0.42),
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        inset 0 -1px 2px rgba(0, 0, 0, 0.4) !important;
      border-color: rgba(255, 255, 255, 0.26) !important;
    }

    /* Filter Grid Container Glass Style */
    .grid.grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-4.gap-3 {
      background: rgba(18, 18, 26, 0.45) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.02) !important;
      border-radius: 20px !important;
      padding: 18px !important;
    }

    /* Premium Inputs and Dropdowns */
    input[type="text"],
    select {
      background: rgba(10, 10, 14, 0.55) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.4),
        0 1px 0 rgba(255, 255, 255, 0.02) !important;
      border-radius: 12px !important;
      color: #f3f4f6 !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: rgba(99, 102, 241, 0.6) !important;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.4),
        0 0 14px rgba(99, 102, 241, 0.3) !important;
      background: rgba(12, 12, 18, 0.75) !important;
    }

    /* Volumetric Glass Cards (Game items) */
    #catalog-results-area .group[data-catalog-key] {
      background: rgba(16, 16, 22, 0.48) !important;
      backdrop-filter: blur(20px) saturate(140%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(140%) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 2px rgba(0, 0, 0, 0.3) !important;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
      overflow: hidden;
    }

    /* iOS Liquid glass gloss reflection on the upper part of each card */
    #catalog-results-area .group[data-catalog-key]::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.01) 80%, transparent 100%);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.35s ease;
    }

    #catalog-results-area .group[data-catalog-key]:hover {
      transform: translateY(-5px) scale(1.02) !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.55),
        0 0 24px var(--card-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
    }

    #catalog-results-area img {
      filter: brightness(0.92) contrast(1.04);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    #catalog-results-area .group[data-catalog-key]:hover img {
      transform: scale(1.035);
      filter: brightness(1.04) contrast(1.06);
    }

    /* Columns in Mural de Jogos (Mural of Games) */
    #mural-horizontal-scroll>div {
      background: rgba(14, 14, 20, 0.45) !important;
      backdrop-filter: blur(28px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(150%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      box-shadow:
        0 16px 36px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
      border-radius: 24px !important;
      padding: 8px !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #mural-horizontal-scroll>div:hover {
      border-color: rgba(255, 255, 255, 0.1) !important;
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
    }

    /* Inner games items in columns */
    #mural-horizontal-scroll [data-list-preview-key] {
      background: rgba(255, 255, 255, 0.015) !important;
      border: 1px solid rgba(255, 255, 255, 0.02) !important;
      border-radius: 14px !important;
      margin-bottom: 8px !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
    }

    #mural-horizontal-scroll [data-list-preview-key]:hover {
      background: rgba(255, 255, 255, 0.04) !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
      transform: translateY(-1.5px);
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
    }

    /* Finished game items with green glow / border */
    #mural-horizontal-scroll .border-\[\#10b981\]\/40 {
      background: rgba(16, 185, 129, 0.025) !important;
      border: 1px solid rgba(16, 185, 129, 0.24) !important;
      box-shadow:
        0 4px 16px rgba(16, 185, 129, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.02) !important;
    }

    #mural-horizontal-scroll .border-\[\#10b981\]\/40:hover {
      background: rgba(16, 185, 129, 0.055) !important;
      border-color: rgba(16, 185, 129, 0.42) !important;
      box-shadow:
        0 8px 24px rgba(16, 185, 129, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
    }

    /* Premium Glass Action Buttons */
    #btn-clear-finished,
    #btn-view-history,
    #btn-delete-selected,
    #btn-add-provider,
    #btn-import-csv,
    #btn-add-games-main,
    #btn-sync-gdrive {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
      border-radius: 12px !important;
    }

    #btn-sync-gdrive {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    #btn-sync-gdrive:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05) !important;
    }

    /* Beautiful Capsule-style Quick Filter Caps */
    .quick-filter-btn {
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
      border-radius: 9999px !important;
    }

    .quick-filter-btn:not(.bg-white):not(.bg-\[\#10b981\]):not(.bg-\[\#f59e0b\]):not(.bg-blue-500) {
      background: rgba(255, 255, 255, 0.03) !important;
      color: #a1a1aa !important;
    }

    .quick-filter-btn:not(.bg-white):not(.bg-\[\#10b981\]):not(.bg-\[\#f59e0b\]):not(.bg-blue-500):hover {
      background: rgba(255, 255, 255, 0.07) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      transform: translateY(-1.5px);
    }

    .quick-filter-btn.bg-white {
      background: linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15), inset 0 1px 0 #ffffff !important;
      color: #09090b !important;
    }

    .quick-filter-btn.bg-\[\#10b981\] {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.85) 0%, rgba(5, 150, 105, 0.85) 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(16, 185, 129, 0.3) !important;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
    }

    .quick-filter-btn.bg-\[\#f59e0b\] {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.85) 0%, rgba(217, 119, 6, 0.85) 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(245, 158, 11, 0.3) !important;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
    }

    .quick-filter-btn.bg-blue-500 {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.85) 0%, rgba(37, 99, 235, 0.85) 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(59, 130, 246, 0.3) !important;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
    }

    /* Premium Glass Image Preview Modal Overlay */
    #preview-modal>div {
      background: rgba(20, 20, 28, 0.65) !important;
      backdrop-filter: blur(40px) saturate(185%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(185%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
      border-radius: 32px !important;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    #preview-modal button.bg-zinc-800 {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      transition: all 0.25s ease !important;
    }

    #preview-modal button.bg-zinc-800:hover {
      background: rgba(255, 255, 255, 0.09) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      transform: translateY(-1px);
    }

    /* Disconnected Overlay Glass Style */
    #disconnected-card-desktop {
      background: linear-gradient(165deg, rgba(28, 16, 0, 0.75) 0%, rgba(12, 9, 0, 0.92) 100%) !important;
